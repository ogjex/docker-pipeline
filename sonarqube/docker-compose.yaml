networks:
  forgejo:
    external: true

services:
  sonar-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD}
      POSTGRES_DB: sonarqube
    volumes:
      - sonar-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonarqube"]
      interval: 10s
      retries: 10

  sonarqube:
    image: sonarqube:${SONAR_TAG:-community}
    container_name: sonarqube
    restart: unless-stopped
    depends_on:
      sonar-db: { condition: service_healthy }
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD}
    ulimits:
      nofile: { soft: 131072, hard: 131072 }
      nproc: 8192
    volumes:
      - sonar-data:/opt/docker-pipeline/sonarqube/data
      - sonar-ext:/opt/docker-pipeline/sonarqube/extensions
      - sonar-logs:/opt/docker-pipeline/sonarqube/logs
    networks:
      - default
      - forgejo
    ports:
      - "9000:9000"

volumes:
  sonar-db:
  sonar-data:
  sonar-ext:
  sonar-logs:
