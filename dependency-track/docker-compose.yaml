networks:
  forgejo:
    external: true

services:
  dtrack-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: dtrack
      POSTGRES_PASSWORD: ${DTRACK_DB_PASSWORD}
      POSTGRES_DB: dtrack
      EXTRA_JAVA_OPTIONS: "-Xmx${DT_HEAP:-2g}"
      mem_limit: ${DT_MEM_LIMIT:-4g}
    volumes:
      - dtrack-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dtrack -d dtrack"]
      interval: 10s
      retries: 10

  dtrack-api:
    image: dependencytrack/apiserver:${DT_TAG}
    container_name: dtrack-api
    restart: unless-stopped
    depends_on:
      dtrack-db: { condition: service_healthy }
    environment:
      DT_DATASOURCE_URL: jdbc:postgresql://dtrack-db:5432/dtrack
      DT_DATASOURCE_USERNAME: dtrack
      DT_DATASOURCE_PASSWORD: ${DTRACK_DB_PASSWORD}
      EXTRA_JAVA_OPTIONS: "-Xmx${DT_HEAP:-2g}"
    mem_limit: ${DT_MEM_LIMIT:-4g}
    volumes:
      - dtrack-data:/data
    networks:
      - default
      - forgejo
    ports:
      - "8081:8080"

  dtrack-frontend:
    image: dependencytrack/frontend:${DT_TAG}
    container_name: dtrack-frontend
    restart: unless-stopped
    depends_on: [dtrack-api]
    environment:
      API_BASE_URL: http://${HOST_ADDR:-localhost}:8081
    ports:
      - "8080:8080"

volumes:
  dtrack-db:
  dtrack-data:
